<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>CrocShare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="avatar" id="me-avatar">C</div>
        <div class="brand-text">
          <div class="title">CrocShare</div>
          <div class="subtitle" id="me-status">Démarrage…</div>
        </div>
      </div>
      <nav class="nav">
        <div class="section-title">Contacts</div>
        <ul id="contacts-list">
          <li class="empty">Aucun contact</li>
        </ul>
        <button id="add-contact-btn">+ Ajouter un contact</button>
        <div class="section-title" style="margin-top: 16px">Salons</div>
        <ul id="channels-list">
          <li class="empty">Aucun salon</li>
        </ul>
      </nav>
    </aside>

    <main id="content">
      <div id="welcome">
        <h1>CrocShare Windows</h1>
        <p class="muted">Sélectionne un contact à gauche pour commencer à discuter.</p>
        <p class="muted small">Cette version Windows utilise le même protocole P2P (Hyperswarm) que l'app macOS — interopérable entre les deux.</p>
      </div>
    </main>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
