<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
  <title>CrocShare</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ── SIDEBAR ─────────────────────────────────────────────────── -->
    <aside id="sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <button class="me-avatar" id="me-avatar" title="Changer ma photo">
          <span id="me-initial">C</span>
          <span class="camera-badge">📷</span>
        </button>
        <div class="brand-text">
          <div class="brand-title">CrocShare</div>
          <div class="brand-subtitle" id="me-status">P2P chiffré</div>
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <nav class="nav">
        <button class="nav-item" data-route="myfiles">
          <span class="left-accent"></span>
          <span class="nav-icon">📁</span>
          <span class="nav-label">Mes fichiers partagés</span>
        </button>
        <button class="nav-item" data-route="sharedfolders">
          <span class="left-accent"></span>
          <span class="nav-icon">👥</span>
          <span class="nav-label">Dossiers partagés</span>
        </button>

        <div class="section">
          <button class="section-header" data-section="rooms">
            <span class="chev">▼</span>
            <span class="section-icon">#</span>
            <span class="section-title">SALONS</span>
            <span class="section-add">+</span>
          </button>
          <ul class="section-list" id="rooms-list">
            <li class="empty">Aucun salon</li>
          </ul>
        </div>

        <div class="section">
          <button class="section-header" data-section="dm">
            <span class="chev">▼</span>
            <span class="section-icon">💬</span>
            <span class="section-title">MESSAGES DIRECTS</span>
            <span class="section-add" id="add-contact-btn">+</span>
          </button>
          <ul class="section-list" id="contacts-list">
            <li class="empty">Aucun contact</li>
          </ul>
        </div>

        <div class="section">
          <button class="section-header" data-section="folders">
            <span class="chev">▼</span>
            <span class="section-icon">📁</span>
            <span class="section-title">DOSSIERS PARTAGÉS</span>
            <span class="section-add">+</span>
          </button>
          <ul class="section-list" id="folders-list">
            <li class="empty">Aucun contact fichier</li>
          </ul>
        </div>
      </nav>

      <div class="sidebar-divider"></div>
      <div class="sidebar-footer">
        <button class="nav-item" data-route="settings">
          <span class="left-accent"></span>
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Réglages</span>
        </button>
      </div>
    </aside>

    <!-- ── CONTENT ─────────────────────────────────────────────────── -->
    <main id="content">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">⚡</div>
        <h1>CrocShare</h1>
        <p class="muted">Partage de dossier et chat en pair-à-pair,<br/>chiffré de bout en bout, sans serveur ni relai.</p>
        <button id="welcome-pair" class="btn-primary">Ajouter un contact…</button>
      </div>
    </main>

    <!-- ── RIGHT INFO PANEL ────────────────────────────────────────── -->
    <aside id="right-panel" class="hidden">
      <div class="right-content"></div>
    </aside>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
